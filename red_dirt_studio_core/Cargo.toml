[package]
name = "red-dirt-studio-core"
version = "0.1.0"
edition = "2021"
description = "Core audio engine for Red Dirt Rhythm Studio"
license = "MIT OR Apache-2.0"

[dependencies]
# Audio processing
hound = "3.5"
rubato = "0.13"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
rodio = "0.17"

# Math & DSP
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"
rustfft = "6.1"
realfft = "3.0"

# ML/AI (optional, for candle integration)
candle-core = { version = "0.4", features = ["accelerate"], optional = true }
candle-nn = { version = "0.4", optional = true }
candle-transformers = { version = "0.4", features = ["accelerate", "mkl"], optional = true }
tokenizers = { version = "0.19", optional = true }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for Ollama
reqwest = { version = "0.11", features = ["json", "stream"] }

# Filesystem
walkdir = "2"
glob = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Image processing
image = "0.24"

# Parallel processing
rayon = "1.8"

[features]
default = []
ml = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]