[package]
name = "red_dirt_karaoke_teleprompter"
version = "1.0.0"
edition = "2021"
authors = ["TexasTunes"]
description = "The world's most advanced karaoke-style teleprompter"

[[bin]]
name = "rd_teleprompter"
path = "src/main.rs"

[workspace.dependencies]
cpal = "0.15"
rodio = "0.20"
realfft = "3"
rustfft = "6"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rayon = "1"
dashmap = "6"
ndarray = "0.16"
nalgebra = "0.33"
hound = "3"
symphonia = { version = "0.5", default-features = false, features = ["wav","flac","mp3"] }
futures-util = "0.3"
futures-channel = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
rand = "0.8"
mdns-sd = "0.11"
env_logger = "0.11"

[dependencies]
cpal = { workspace = true }
rodio = { workspace = true }
realfft = { workspace = true }
rustfft = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
serde_json = { workspace = true }
# GUI
eframe = "0.30"
egui = "0.30"
# Concurrency & Performance
crossbeam-channel = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
dashmap = { workspace = true }
# Math & Linear Algebra
ndarray = { workspace = true }
nalgebra = { workspace = true }
# Audio formats
hound = { workspace = true }
symphonia = { workspace = true }
# Async streaming helpers
futures-util = { workspace = true }
futures-channel = { workspace = true }
# Utilities
uuid = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
# Multicast discovery
mdns-sd = { workspace = true }
# Logging
env_logger = { workspace = true }
