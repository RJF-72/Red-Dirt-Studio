[package]
name = "red-dirt-studio-app"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.5", features = ["desktop"] }
dioxus-logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
console_error_panic_hook = "0.1"
futures = "0.3"
futures-channel = "0.3"
rand = "0.8"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
red-dirt-studio-core = { path = "../red_dirt_studio_core" }
anyhow = "1"
ndarray = "0.15"
rodio = "0.17"
cpal = "0.15"

[profile.release]
opt-level = 3
lto = true
